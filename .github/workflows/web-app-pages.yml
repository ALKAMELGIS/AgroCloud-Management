name: Web app (GitHub Pages)

# Publishes the AgroCloud demo build (works offline, in-browser demo data) straight to
# GitHub Pages as an Actions deployment, so it opens at https://<owner>.github.io/<repo>/
# and installs on an iPhone from Safari: Share → Add to Home Screen.
#
# The site no longer comes from the "gh-pages" branch: whatever is pushed there
# (by any other tool or system) cannot replace AgroCloud.
# One-time setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-app-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build demo web app
        env:
          CI: false
          # Optional: Settings → Secrets and variables → Actions. Built into the public site.
          DEMO_OPENWEATHER_API_KEY: ${{ secrets.DEMO_OPENWEATHER_API_KEY }}
          DEMO_SENTINELHUB_INSTANCE_ID: ${{ secrets.DEMO_SENTINELHUB_INSTANCE_ID }}
        run: bash scripts/build-demo.sh
      - name: Check it is AgroCloud
        run: |
          grep -q "<title>AgroCloud Management</title>" build-demo/index.html
          ! grep -rqi "agrosyntra" build-demo/index.html
          touch build-demo/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
