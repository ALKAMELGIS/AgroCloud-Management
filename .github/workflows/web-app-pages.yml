name: Web app (GitHub Pages)

# Publishes the demo build (works offline, in-browser demo data) to the "gh-pages"
# branch, so it opens at https://<owner>.github.io/<repo>/ and installs on an
# iPhone from Safari: Share → Add to Home Screen.
# One-time setting: Settings → Pages → Source "Deploy from a branch" → gh-pages / root.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-app-pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build demo web app
        env:
          CI: false
          # Optional: Settings → Secrets and variables → Actions. Built into the public site.
          DEMO_OPENWEATHER_API_KEY: ${{ secrets.DEMO_OPENWEATHER_API_KEY }}
          DEMO_SENTINELHUB_INSTANCE_ID: ${{ secrets.DEMO_SENTINELHUB_INSTANCE_ID }}
        run: bash scripts/build-demo.sh
      - name: Publish to gh-pages
        run: |
          cd build-demo
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
